name: pages
on:
  - push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - id: benchmark
        uses: mikefarah/yq@master
        with:
          cmd: yq 'with(.[]; .["Decompression Rate (MB/s)"] = 1000 * .["Total Raw Bytes"] / .["Decode Time (ns)"] | .["Compression Rate (MB/s)"] = 1000 * .["Total Raw Bytes"] / .["Encode Time (ns)"]) | {"html": {"style": "table { border-collapse: collapse } table, thead, tfoot { border: 0.2rem solid CanvasText } th, td { border: 0.1rem solid CanvasText }", "body": {"table": {"caption": "zig-qoi benchmark", "thead": {"tr": [{"th": (.[0] | keys)}]}, "tbody": {"tr": (.[] |= {"td": map(.)})}}}}}' -o xml data/benchmark.tsv
      - run: install -D ${{steps.benchmark.outputs.result}} pages/benchmark.html
      - uses: actions/upload-pages-artifact@v3 # or specific "vX.X.X" version tag for this action
        with:
          path: pages/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
